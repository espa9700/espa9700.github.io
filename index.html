<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Importrebel - Sistema ERP / CRM</title>
  <style>
    /* Estilos para Pantalla (Modo Oscuro) */
    body {
      background-color: #121824;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .invoice-card {
      background-color: #1a2332;
      border: 1px solid #2a3447;
      padding: 24px;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .btn {
      background-color: #25d366;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-print {
      background-color: #3b82f6;
    }

    /* ESTILOS DE IMPRESIÓN (SOLUCIÓN AL FONDO OSCURO EN IMPRESIÓN) */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      .invoice-card {
        background-color: #ffffff !important;
        color: #000000 !important;
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
      }

      table, th, td {
        border-color: #000000 !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Botones de Acción (Ocultos al imprimir) -->
  <div class="no-print" style="text-align: center; margin-bottom: 20px;">
    <button class="btn btn-print" onclick="window.print()">Imprimir Factura</button>
    <button class="btn" onclick="enviarRecordatorioWhatsApp()">Enviar Recordatorio WhatsApp</button>
  </div>

  <!-- Contenido de la Factura -->
  <div class="invoice-card" id="factura">
    <h2>Factura #VNT-317434</h2>
    <p><strong>Cliente:</strong> Jefferson</p>
    <hr />
    <p>Monto Total: <strong>$40.00 USD</strong></p>
    <p>Abonado: <strong>$10.00 USD</strong></p>
    <p>Saldo Restante: <strong>$30.00 USD (23132.14 Bs)</strong></p>
  </div>

  <script>
    // Datos dinámicos de la transacción
    const datosCliente = {
      nombre: "Jefferson",
      telefono: "584141511026", // Número sin el signo +
      numeroCompra: "VNT-317434",
      montoTotal: "40.00",
      abonado: "10.00",
      saldoPendienteUSD: "30.00",
      saldoPendienteBS: "23132.14"
    };

    // FUNCIÓN PARA ENVIAR WHATSAPP CON FORMATO Y ESPACIOS CORRECTOS
    function enviarRecordatorioWhatsApp() {
      // Definición del texto con saltos de línea explícitos
      const mensaje = 
        `Hola *${datosCliente.nombre}*, te saludamos de *Importrebel*. Le recordamos que tiene un saldo pendiente de *$${datosCliente.saldoPendienteUSD} USD* (${datosCliente.saldoPendienteBS} Bs) correspondiente a su compra *#${datosCliente.numeroCompra}*.\n\n` +
        `Monto Total: $${datosCliente.montoTotal}\n` +
        `Abonado: $${datosCliente.abonado}\n` +
        `Saldo Restante: $${datosCliente.saldoPendienteUSD}\n\n` +
        `¡Quedamos atentos a su reporte de pago!`;

      // Codificación correcta del mensaje para URL
      const mensajeCodificado = encodeURIComponent(mensaje);
      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${datosCliente.telefono}&text=${mensajeCodificado}`;

      // Abrir WhatsApp en una nueva pestaña
      window.open(urlWhatsApp, '_blank');
    }
  </script>
</body>
</html>
