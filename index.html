<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importrebel - Sistema ERP / CRM</title>
  <style>
    /* VARIABLES Y TEMA TIPO DASHBOARD */
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-blue: #3b82f6;
      --primary-blue-hover: #2563eb;
      --whatsapp-green: #25d366;
      --whatsapp-hover: #1ebd56;
      --danger-red: #ef4444;
      --warning-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* CONTROLES Y BOTONES */
    .actions-bar {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #ffffff;
      text-decoration: none;
    }

    .btn-print {
      background-color: var(--primary-blue);
    }
    .btn-print:hover {
      background-color: var(--primary-blue-hover);
    }

    .btn-whatsapp {
      background-color: var(--whatsapp-green);
    }
    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
    }

    /* TARJETA FACTURA EN PANTALLA */
    .invoice-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .invoice-tag {
      font-size: 14px;
      color: var(--text-muted);
      text-align: right;
    }

    .invoice-tag span {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .info-box p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .info-box strong {
      color: var(--text-main);
      font-size: 15px;
    }

    /* TABLA RESUMEN */
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .invoice-table th, 
    .invoice-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .invoice-table th {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .totals-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      border-top: 2px solid var(--border-color);
      padding-top: 16px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      width: 260px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .total-row.highlight {
      font-size: 16px;
      font-weight: 700;
      color: var(--warning-yellow);
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    /* CONFIGURACIÓN EXACTA PARA IMPRESIÓN Y EXPORTACIÓN PDF */
    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm;
      }

      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        font-size: 12pt;
      }

      .no-print {
        display: none !important;
      }

      .container {
        max-width: 100% !important;
        margin: 0 !important;
      }

      .invoice-card {
        background-color: #ffffff !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        color: #000000 !important;
      }

      .brand-title {
        color: #000000 !important;
      }

      .invoice-tag span {
        color: #000000 !important;
      }

      .invoice-header,
      .invoice-table th,
      .invoice-table td,
      .totals-container,
      .total-row.highlight {
        border-color: #cbd5e1 !important;
      }

      .info-box p,
      .invoice-table th,
      .total-row {
        color: #475569 !important;
      }

      .info-box strong,
      .invoice-table td,
      .total-row.highlight {
        color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Botones de Acción (Se ocultan al imprimir/guardar PDF) -->
    <div class="actions-bar no-print">
      <button class="btn btn-print" onclick="window.print()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        Imprimir / Guardar PDF
      </button>

      <button class="btn btn-whatsapp" onclick="enviarRecordatorioWhatsApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.842-1.001z"/>
        </svg>
        Enviar Recordatorio WhatsApp
      </button>
    </div>

    <!-- Factura Estructurada -->
    <div class="invoice-card" id="factura">
      <div class="invoice-header">
        <div>
          <h1 class="brand-title">Importrebel</h1>
          <p style="color: var(--text-muted); font-size: 13px; margin-top: 2px;">Sistema ERP / CRM</p>
        </div>
        <div class="invoice-tag">
          COMPROBANTE DE VENTA
          <span id="txt-id-venta">#VNT-317434</span>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-box">
          <p>Cliente</p>
          <strong id="txt-cliente">Jefferson</strong>
        </div>
        <div class="info-box" style="text-align: right;">
          <p>Estado del Pago</p>
          <strong style="color: var(--warning-yellow);">PENDIENTE</strong>
        </div>
      </div>

      <table class="invoice-table">
        <thead>
          <tr>
            <th>Descripción</th>
            <th style="text-align: right;">Monto (USD)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Compra de mercancía / Orden VNT-317434</td>
            <td style="text-align: right;" id="txt-monto-total">$40.00</td>
          </tr>
        </tbody>
      </table>

      <div class="totals-container">
        <div class="total-row">
          <span>Monto Total:</span>
          <strong id="lbl-total">$40.00 USD</strong>
        </div>
        <div class="total-row">
          <span>Abonado:</span>
          <strong id="lbl-abonado">$10.00 USD</strong>
        </div>
        <div class="total-row highlight">
          <span>Saldo Restante:</span>
          <strong id="lbl-saldo">$30.00 USD</strong>
        </div>
        <div class="total-row" style="font-size: 12px; margin-top: 4px;">
          <span>Equivalente en Bs:</span>
          <strong id="lbl-saldo-bs">23,132.14 Bs</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Objeto centralizado de la transacción
    const datosCliente = {
      nombre: "Jefferson",
      telefono: "584141511026", // Código de país + número sin espacios ni símbolos
      numeroCompra: "VNT-317434",
      montoTotal: 40.00,
      abonado: 10.00,
      saldoPendienteUSD: 30.00,
      saldoPendienteBS: "23132.14"
    };

    // Función para enviar mensaje por WhatsApp con saltos de línea y negritas nativas
    function enviarRecordatorioWhatsApp() {
      const mensaje = 
        `Hola *${datosCliente.nombre}*, te saludamos de *Importrebel*.\n\n` +
        `Le recordamos que tiene un saldo pendiente de *$${datosCliente.saldoPendienteUSD.toFixed(2)} USD* (${datosCliente.saldoPendienteBS} Bs) correspondiente a su compra *#${datosCliente.numeroCompra}*.\n\n` +
        `Monto Total: $${datosCliente.montoTotal.toFixed(2)}\n` +
        `Abonado: $${datosCliente.abonado.toFixed(2)}\n` +
        `Saldo Restante: $${datosCliente.saldoPendienteUSD.toFixed(2)}\n\n` +
        `¡Quedamos atentos a su reporte de pago!`;

      // encodeURIComponent preserva los saltos de línea (\n) convirtiéndolos a %0A
      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${datosCliente.telefono}&text=${encodeURIComponent(mensaje)}`;
      
      window.open(urlWhatsApp, '_blank');
    }
  </script>
</body>
</html>
